# -------------------------
# WEBDRIVER
# -------------------------
webdriver.driver=provided
webdriver.provided.type=mydriver
webdriver.provided.mydriver=utils.MyDriver

webdriver.timeouts.implicitlywait=3000
webdriver.wait.for.timeout=5000

# -------------------------
# SERENITY
# -------------------------
serenity.project.name=IVR
serenity.take.screenshots=FOR_FAILURES
serenity.report.encoding=utf8
serenity.reports.show.step.details=false
serenity.store.html.source=false
serenity.timeout=8000
serenity.resized.image.width=600
serenity.compress.screenshots=true
serenity.console.colors=true

# -------------------------
# FEATURES
# -------------------------
feature.file.language=es
feature.file.encoding=utf8

# -------------------------
# NAVEGADOR
# -------------------------
serenity.browser.maximized=true